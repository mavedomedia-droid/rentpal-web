<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Add Photos – RentPal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'DM Sans',sans-serif;background:#f1f5f9;color:#0f1117;line-height:1.6;min-height:100vh;display:flex;flex-direction:column}
    .container{max-width:560px;margin:40px auto;padding:0 20px;flex:1}
    .logo{font-family:'Plus Jakarta Sans',sans-serif;font-size:22px;font-weight:700;color:#4A8FD4;margin-bottom:24px}
    h1{font-size:24px;font-weight:800;margin-bottom:8px}
    .card{background:#fff;border-radius:16px;border:1px solid rgba(0,0,0,0.06);padding:24px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,0.04)}
    .card h2{font-size:18px;font-weight:700;margin-bottom:12px}
    .label{font-size:12px;color:#9299a8;text-transform:uppercase;letter-spacing:0.5px}
    .value{font-size:15px;margin-bottom:8px}
    .upload-area{background:#f8fafc;border:2px dashed #cbd5e1;border-radius:12px;padding:32px;text-align:center;cursor:pointer;transition:all 0.2s}
    .upload-area:hover{border-color:#4A8FD4;background:#f0f4fb}
    .upload-area.dragover{border-color:#4A8FD4;background:#E6F1FB}
    .upload-area input{display:none}
    .preview{max-width:100%;max-height:200px;border-radius:8px;margin-top:12px;display:none}
    .btn{display:block;width:100%;padding:14px;background:#4A8FD4;color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;text-align:center;transition:all 0.2s;margin-top:12px}
    .btn:disabled{opacity:0.5;cursor:not-allowed}
    .error{color:#dc2626;font-size:14px;margin-top:8px}
    .success{color:#27500A;background:#EAF3DE;padding:16px;border-radius:8px;margin-top:12px}
    .loading{text-align:center;padding:40px;color:#5a6072}
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">rentpal</div>
    <div id="content">
      <div class="loading">Loading your listing…</div>
    </div>
  </div>
  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbzmMrwyXnu7DPIt3bp-jwVL5FtsBCGO4Zu5s0tenSu88j1FQPLTOIBLmw1SSMTetD8ItA/exec';
    
    async function getListing(id) {
      const res = await fetch(`${GAS_URL}?action=listing&id=${encodeURIComponent(id)}`);
      if (!res.ok) throw new Error('Network error');
      const data = await res.json();
      return data.listing;
    }

    let selectedFile = null;
    function setupUpload() {
      const dropArea = document.getElementById('drop-area');
      const fileInput = document.getElementById('file-input');
      const preview = document.getElementById('preview');
      
      dropArea.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', (e) => {
        if (e.target.files.length) {
          selectedFile = e.target.files[0];
          showPreview(selectedFile);
        }
      });
      dropArea.addEventListener('dragover', (e) => { e.preventDefault(); dropArea.classList.add('dragover'); });
      dropArea.addEventListener('dragleave', () => dropArea.classList.remove('dragover'));
      dropArea.addEventListener('drop', (e) => {
        e.preventDefault();
        dropArea.classList.remove('dragover');
        if (e.dataTransfer.files.length) {
          selectedFile = e.dataTransfer.files[0];
          showPreview(selectedFile);
        }
      });
    }

    function showPreview(file) {
      const preview = document.getElementById('preview');
      const reader = new FileReader();
      reader.onload = (e) => {
        preview.src = e.target.result;
        preview.style.display = 'block';
      };
      reader.readAsDataURL(file);
    }

    async function upload() {
      if (!selectedFile) return alert('Please select an image.');
      const listingId = new URLSearchParams(window.location.search).get('id');
      const btn = document.getElementById('upload-btn');
      btn.disabled = true;
      btn.textContent = 'Uploading…';
      const formData = new FormData();
      formData.append('file', selectedFile);
      try {
        const res = await fetch(`${GAS_URL}?action=uploadPhoto&listingId=${encodeURIComponent(listingId)}&format=json`, {
          method: 'POST',
          body: formData
        });
        const result = await res.json();
        if (result.success) {
          document.getElementById('upload-section').innerHTML = `<div class="success">✅ Photo uploaded! Your listing now has an image. <a href="https://rentpal-web.netlify.app/listings/?id=${listingId}" target="_blank">View listing →</a></div>`;
        } else {
          document.getElementById('error-msg').textContent = result.message || 'Upload failed.';
          btn.disabled = false;
          btn.textContent = 'Upload Photo';
        }
      } catch(e) {
        document.getElementById('error-msg').textContent = 'Network error. Please try again.';
        btn.disabled = false;
        btn.textContent = 'Upload Photo';
      }
    }

    async function init() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      if (!id) {
        document.getElementById('content').innerHTML = '<div class="error">No listing ID provided.</div>';
        return;
      }
      try {
        const listing = await getListing(id);
        if (!listing) throw new Error('Listing not found.');
        document.getElementById('content').innerHTML = `
          <div class="card">
            <h2>🏠 Your Apartment</h2>
            <div class="label">Apartment</div>
            <div class="value"><strong>${escapeHTML(listing.apartmentType)}</strong></div>
            <div class="label">Location</div>
            <div class="value">${escapeHTML(listing.area)}, ${escapeHTML(listing.location)}</div>
            <div class="label">Rent</div>
            <div class="value">${formatNaira(listing.rentExact)}/year</div>
            <div class="label">Reference</div>
            <div class="value" style="font-family:monospace">${listing.listingId}</div>
          </div>
          <div class="card" id="upload-section">
            <h2>📷 Add a Photo</h2>
            <p style="color:#5a6072; margin-bottom:12px;">Upload an image of your apartment (JPEG or PNG, max 5 MB).</p>
            <div class="upload-area" id="drop-area">
              <input type="file" id="file-input" accept="image/jpeg,image/png">
              <div style="font-size:24px; margin-bottom:8px;">📁</div>
              <div style="font-weight:500;">Click or drag an image here</div>
              <div style="font-size:12px; color:#9299a8;">JPG, PNG up to 5MB</div>
              <img id="preview" class="preview" alt="Preview">
            </div>
            <button class="btn" id="upload-btn" onclick="upload()">Upload Photo</button>
            <div id="error-msg" class="error"></div>
          </div>`;
        setupUpload();
      } catch(e) {
        document.getElementById('content').innerHTML = `<div class="error">Could not load listing. Please check your link.</div>`;
      }
    }

    function escapeHTML(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
    function formatNaira(n){ if(!n||isNaN(n))return'—'; return'₦'+parseInt(n).toLocaleString('en-NG'); }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
