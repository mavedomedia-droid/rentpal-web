<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Modal Test</title>
    <style>
        body{font-family:sans-serif;text-align:center;padding:50px;}
        .modal{display:none;position:fixed;z-index:300;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,0.5);align-items:center;justify-content:center}
        .modal.active{display:flex}
        .modal-content{background:#fff;border-radius:12px;padding:28px 24px;max-width:500px;width:90%;position:relative}
        .modal-close{position:absolute;top:12px;right:16px;font-size:22px;background:none;border:none;cursor:pointer}
    </style>
</head>
<body>
    <button id="openModalBtn" style="padding:12px 24px;font-size:16px;">Request Introduction</button>

    <div id="introModal" class="modal">
        <div class="modal-content" id="introModalContent">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <h2>Test Modal</h2>
            <p>If you see this, the modal works.</p>
        </div>
    </div>

    <script>
        const modal = document.getElementById('introModal');
        document.getElementById('openModalBtn').addEventListener('click', () => {
            modal.classList.add('active');
        });
        function closeModal() {
            modal.classList.remove('active');
        }
        window.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });
    </script>
</body>
</html>
