<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Respond to Introduction – RentPal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* (keep your existing styles – unchanged) */
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'DM Sans',sans-serif;background:#f1f5f9;color:#0f1117;line-height:1.6;min-height:100vh;display:flex;flex-direction:column}
    .container{max-width:640px;margin:40px auto;padding:0 20px;flex:1}
    .logo{font-family:'Plus Jakarta Sans',sans-serif;font-size:22px;font-weight:700;color:#4A8FD4;margin-bottom:24px}
    h1{font-size:24px;font-weight:800;margin-bottom:8px}
    .subtitle{color:#5a6072;margin-bottom:24px}
    .card{background:#fff;border-radius:16px;border:1px solid rgba(0,0,0,0.06);padding:24px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,0.04)}
    .card h2{font-size:18px;font-weight:700;margin-bottom:12px}
    .badge{display:inline-block;padding:3px 10px;border-radius:100px;font-size:11px;font-weight:600;margin-bottom:12px}
    .badge.available{background:#EAF3DE;color:#27500A}
    .badge.unavailable{background:#fee2e2;color:#991b1b}
    .label{font-size:12px;color:#9299a8;text-transform:uppercase;letter-spacing:0.5px}
    .value{font-size:15px;margin-bottom:8px}
    .actions{display:flex;flex-direction:column;gap:10px;margin-top:20px}
    .btn{display:block;width:100%;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;text-align:center;transition:all 0.2s;position:relative;overflow:hidden}
    .btn:active{transform:scale(0.98)}
    .btn-approve{background:#4A8FD4;color:#fff}
    .btn-approve:hover{background:#185FA5}
    .btn-decline{background:#fff;color:#5a6072;border:1.5px solid rgba(0,0,0,0.12)}
    .btn-decline:hover{background:#f1f5f9}
    .btn-unavailable{background:#e74c3c;color:#fff}
    .btn-unavailable:hover{background:#c0392b}
    .btn:disabled{opacity:0.6;cursor:not-allowed;transform:none}
    .btn .spinner{display:none;width:20px;height:20px;border:3px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto}
    .btn.loading .spinner{display:block}
    .btn.loading .btn-text{display:none}
    @keyframes spin{to{transform:rotate(360deg)}}
    .empty{text-align:center;color:#9299a8;padding:40px}
    .skeleton{background:linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:8px;height:16px;margin-bottom:12px}
    .skeleton.card{height:120px;border-radius:16px;margin-bottom:20px;padding:20px}
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
    .seeker-prefs{margin-top:16px;background:#f8fafc;border-radius:12px;padding:16px}
    .seeker-prefs h3{font-size:15px;font-weight:700;margin-bottom:8px}
    .confirmation{text-align:center;padding:30px;color:#27500A;background:#EAF3DE;border-radius:12px;margin-top:20px;animation:fadeIn 0.3s ease}
    .confirmation.error{background:#fee2e2;color:#991b1b}
    @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .question-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid #eef1f5}
    .question-row:last-child{border-bottom:none}
    .question-text{flex:1;font-size:14px;color:#0f1117}
    .toggle-group{display:flex;gap:6px}
    .toggle-btn{padding:4px 14px;border-radius:6px;border:1.5px solid #ccc;background:transparent;font-weight:600;font-size:13px;cursor:pointer;transition:all 0.15s}
    .toggle-btn.yes{color:#4CAF85;border-color:#4CAF85}
    .toggle-btn.yes.selected{background:#4CAF85;color:#fff}
    .toggle-btn.no{color:#e74c3c;border-color:#e74c3c}
    .toggle-btn.no.selected{background:#e74c3c;color:#fff}
    .toggle-btn:disabled{opacity:0.5;cursor:not-allowed}
    .answer-status{font-size:11px;color:#5a6072;margin-left:8px}
    .error-msg{color:#e74c3c;font-size:13px;margin-top:8px;display:none}
    .support-link{display:block;text-align:center;margin-top:12px;font-size:13px;color:#4A8FD4;text-decoration:none}
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">rentpal</div>
    <h1>Someone wants your apartment</h1>
    <p class="subtitle">Review the request, answer a few questions, and choose how to respond.</p>
    <div id="content">
      <div class="skeleton card"></div>
      <div class="skeleton card"></div>
      <div class="skeleton card" style="height:80px"></div>
    </div>
  </div>

  <!-- Load config, but also provide fallback if missing -->
  <script>
    // Fallback URL (replace with your actual deployment if needed)
    const FALLBACK_GAS_URL = 'https://script.google.com/macros/s/AKfycbyspUyz-Lg_RaaT5bgxWKUrPNaSFsVJMSsCO8alRwJJZ86s7HUOFa6UnTSivcTTTsPR0Q/exec';
    let GAS_URL = FALLBACK_GAS_URL;
  </script>
  <script src="/rentpal-config.js"></script>
  <script>
    // If config loaded, override
    if (typeof RENTPAL_CONFIG !== 'undefined' && RENTPAL_CONFIG.GAS_URL) {
      GAS_URL = RENTPAL_CONFIG.GAS_URL;
    } else {
      console.warn('rentpal-config.js not loaded or missing GAS_URL. Using fallback.');
    }
    console.log('Using GAS_URL:', GAS_URL);
  </script>

  <script>
    let requestData = null;

    // Helper: fetch with timeout
    async function fetchWithTimeout(url, timeout = 10000) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeout);
      try {
        const res = await fetch(url, { signal: controller.signal });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return await res.json();
      } finally {
        clearTimeout(timer);
      }
    }

    async function fetchIntroDetails(requestId) {
      const url = `${GAS_URL}?action=introDetails&requestId=${encodeURIComponent(requestId)}`;
      console.log('Fetching intro details:', url);
      return fetchWithTimeout(url);
    }

    async function performAction(requestId, response, answers) {
      let url = `${GAS_URL}?action=residentResponse&requestId=${encodeURIComponent(requestId)}&response=${response}&format=json`;
      if (response === 'approve' && answers) {
        url += `&answers=${encodeURIComponent(answers)}`;
      }
      console.log('Performing action:', url);
      return fetchWithTimeout(url);
    }

    function formatNaira(n){ if(!n||isNaN(n))return'—'; return'₦'+parseInt(n).toLocaleString('en-NG'); }
    function escapeHTML(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

    function render(data) {
      if (!data.success) {
        document.getElementById('content').innerHTML = `<div class="empty">${escapeHTML(data.message || 'Request not found.')}</div>`;
        return;
      }

      requestData = data;
      const { requestId, status, listing, requester, seekerPrefs } = data;

      if (status !== 'Pending') {
        document.getElementById('content').innerHTML = `
          <div class="card">
            <h2>Request Already Processed</h2>
            <p>This introduction request has already been <strong>${status}</strong>.</p>
            <p style="color:#5a6072; margin-top:8px;">No further action is needed.</p>
          </div>`;
        return;
      }

      let listingHTML = '';
      if (listing) {
        listingHTML = `
          <div class="card">
            <h2>🏠 Your Listed Apartment</h2>
            <div class="badge available">Available</div>
            <div class="label">Apartment</div>
            <div class="value"><strong>${escapeHTML(listing.apartmentType)}</strong></div>
            <div class="label">Location</div>
            <div class="value">${escapeHTML(listing.area)}, ${escapeHTML(listing.location)}</div>
            <div class="label">Rent</div>
            <div class="value">${escapeHTML(listing.rentExact)}/year</div>
            <div class="label">Reference</div>
            <div class="value" style="font-family:monospace">${escapeHTML(listing.listingId)}</div>
          </div>`;
      }

      let requesterHTML = `
        <div class="card">
          <h2>👤 ${escapeHTML(requester.name)}</h2>
          <div class="label">Reason for Request</div>
          <div class="value">${escapeHTML(requester.reason)}</div>
          <div class="label">Move Timeline</div>
          <div class="value">${escapeHTML(requester.moveTimeline)}</div>
        </div>`;

      let knowHTML = '';
      if (seekerPrefs) {
        knowHTML = `
          <div class="card">
            <h2>🔍 What we know about this person</h2>
            <div class="seeker-prefs">
              <div class="label">Preferred Location</div>
              <div class="value">${escapeHTML(seekerPrefs.preferredLocation || '—')}</div>
              <div class="label">Apartment Type</div>
              <div class="value">${escapeHTML(seekerPrefs.preferredAptType || '—')}</div>
              <div class="label">Budget</div>
              <div class="value">${seekerPrefs.budgetMin && seekerPrefs.budgetMax ? formatNaira(seekerPrefs.budgetMin)+' – '+formatNaira(seekerPrefs.budgetMax) : '—'}</div>
              <div class="label">Move Timing</div>
              <div class="value">${escapeHTML(seekerPrefs.moveTiming || '—')}</div>
              <div class="label">Preferred Areas</div>
              <div class="value">${escapeHTML(seekerPrefs.preferredAreas || '—')}</div>
            </div>
          </div>`;
      } else {
        knowHTML = `
          <div class="card">
            <h2>🔍 What we know about this person</h2>
            <p style="color:#5a6072;">No additional information available.</p>
          </div>`;
      }

      const extraQuestions = requester.extraQuestions || '';
      let questionsHTML = '';
      let questionItems = [];

      if (extraQuestions) {
        questionItems = extraQuestions.split(';').map(s => s.trim()).filter(s => s);
        if (questionItems.length) {
          questionsHTML = `
            <div class="card" id="questions-card">
              <h2>📋 Questions from the requester</h2>
              <p style="color:#5a6072; margin-bottom:12px;">Please answer each question with Yes or No.</p>
              <div id="question-list">
                ${questionItems.map((q, idx) => `
                  <div class="question-row" data-idx="${idx}">
                    <span class="question-text">${escapeHTML(q)}</span>
                    <div class="toggle-group">
                      <button class="toggle-btn yes" data-idx="${idx}" data-value="yes">Yes</button>
                      <button class="toggle-btn no" data-idx="${idx}" data-value="no">No</button>
                    </div>
                    <span class="answer-status" id="status-${idx}">✗</span>
                  </div>
                `).join('')}
              </div>
              <div class="error-msg" id="questions-error">Please answer all questions before approving.</div>
            </div>`;
        }
      }

      const actionsHTML = `
        <div class="card" id="action-buttons">
          <h2>Your Response</h2>
          <p style="color:#5a6072; margin-bottom:16px;">Choose how you'd like to proceed with this introduction request.</p>
          <div class="actions">
            <button class="btn btn-approve" id="btn-approve"><span class="btn-text">Approve Introduction</span><span class="spinner"></span></button>
            <button class="btn btn-decline" id="btn-decline"><span class="btn-text">Decline</span><span class="spinner"></span></button>
            <button class="btn btn-unavailable" id="btn-unavailable"><span class="btn-text">Apartment No Longer Available</span><span class="spinner"></span></button>
          </div>
          <a href="mailto:support@rentpal.ng" class="support-link">Need help? Contact support</a>
        </div>`;

      document.getElementById('content').innerHTML = listingHTML + requesterHTML + knowHTML + questionsHTML + actionsHTML;

      if (questionItems.length) {
        document.querySelectorAll('.toggle-btn').forEach(btn => {
          btn.addEventListener('click', function(e) {
            e.stopPropagation();
            const row = this.closest('.question-row');
            const idx = row.dataset.idx;
            const yesBtn = row.querySelector('.toggle-btn.yes');
            const noBtn = row.querySelector('.toggle-btn.no');
            [yesBtn, noBtn].forEach(b => b.classList.remove('selected'));
            this.classList.add('selected');
            const statusSpan = document.getElementById(`status-${idx}`);
            statusSpan.textContent = this.dataset.value === 'yes' ? '✅' : '❌';
            statusSpan.style.color = this.dataset.value === 'yes' ? '#4CAF85' : '#e74c3c';
            checkAllAnswered();
          });
        });
      }

      document.getElementById('btn-approve').addEventListener('click', function() {
        console.log('Approve button clicked');
        if (questionItems.length) {
          const allAnswered = document.querySelectorAll('.question-row').every(row => {
            const status = row.querySelector('.answer-status');
            return status.textContent === '✅' || status.textContent === '❌';
          });
          if (!allAnswered) {
            document.getElementById('questions-error').style.display = 'block';
            document.getElementById('questions-error').scrollIntoView({behavior:'smooth', block:'center'});
            return;
          }
        }
        let answers = [];
        document.querySelectorAll('.question-row').forEach(row => {
          const selected = row.querySelector('.toggle-btn.selected');
          answers.push(selected ? selected.dataset.value : '');
        });
        handleAction(requestId, 'approve', answers.join(';'));
      });

      document.getElementById('btn-decline').addEventListener('click', function() {
        console.log('Decline button clicked');
        handleAction(requestId, 'decline', '');
      });

      document.getElementById('btn-unavailable').addEventListener('click', function() {
        console.log('Unavailable button clicked');
        handleAction(requestId, 'noLongerAvailable', '');
      });
    }

    function checkAllAnswered() {
      const allAnswered = document.querySelectorAll('.question-row').every(row => {
        const status = row.querySelector('.answer-status');
        return status.textContent === '✅' || status.textContent === '❌';
      });
      const error = document.getElementById('questions-error');
      if (error) {
        if (allAnswered) error.style.display = 'none';
        else error.style.display = 'block';
      }
    }

    async function handleAction(requestId, response, answers) {
      console.log('handleAction called:', { requestId, response, answers });
      const buttons = document.querySelectorAll('.btn');
      buttons.forEach(b => {
        b.disabled = true;
        b.classList.add('loading');
      });
      try {
        const result = await performAction(requestId, response, answers);
        console.log('Backend response:', result);
        const confirmationDiv = document.createElement('div');
        confirmationDiv.className = result.success ? 'confirmation' : 'confirmation error';
        let message = escapeHTML(result.message);
        if (response === 'approve' && result.success) {
          message += '<br><small>The requester will receive a payment link to complete the intro fee.</small>';
        }
        confirmationDiv.innerHTML = `<p>${message}</p>`;
        if (!result.success) {
          confirmationDiv.innerHTML += '<a href="mailto:support@rentpal.ng" class="support-link">Contact support</a>';
        }
        const actionCard = document.getElementById('action-buttons');
        if (actionCard) {
          actionCard.innerHTML = '';
          actionCard.appendChild(confirmationDiv);
        } else {
          document.getElementById('content').appendChild(confirmationDiv);
        }
      } catch(e) {
        console.error('Error in handleAction:', e);
        alert('Something went wrong. Please try again.\n' + e.message);
        buttons.forEach(b => {
          b.disabled = false;
          b.classList.remove('loading');
        });
      }
    }

    async function init() {
      const params = new URLSearchParams(window.location.search);
      const requestId = params.get('requestId');
      console.log('Request ID from URL:', requestId);
      if (!requestId) {
        document.getElementById('content').innerHTML = `
          <div class="card">
            <h2>Missing Request ID</h2>
            <p>No request ID was provided in the link. Please check the link and try again.</p>
          </div>`;
        return;
      }
      try {
        const data = await fetchIntroDetails(requestId);
        console.log('Intro details:', data);
        render(data);
      } catch(e) {
        console.error('Error fetching intro details:', e);
        document.getElementById('content').innerHTML = `
          <div class="card">
            <h2>Could Not Load Request</h2>
            <p>We couldn't load the request details. Please try again later or contact support.</p>
            <p style="color:#e74c3c; font-size:13px;">${escapeHTML(e.message)}</p>
            <a href="mailto:support@rentpal.ng" class="support-link">Contact support</a>
          </div>`;
      }
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
