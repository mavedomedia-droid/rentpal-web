<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RentPal — Verified Apartment Listings in Lagos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --blue: #4A8FD4; --blue-dark: #185FA5; --blue-deep: #0C447C;
            --blue-light: #E6F1FB; --blue-mid: #B5D4F4;
            --green: #4CAF85; --green-light: #EAF3DE; --green-dark: #27500A;
            --orange: #F59E0B; --orange-light: #FEF3C7;
            --purple: #8B5CF6; --purple-light: #EDE9FE;
            --ink: #0f1117; --ink-muted: #5a6072; --ink-faint: #9299a8;
            --surface: #f1f5f9; --white: #ffffff;
            --card-bg: #ffffff; --card-border: rgba(0,0,0,0.06);
            --card-shadow: 0 2px 8px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.05);
            --card-shadow-hover: 0 8px 24px rgba(0,0,0,0.10), 0 2px 6px rgba(0,0,0,0.06);
            --radius-sm: 8px; --radius: 12px; --radius-lg: 16px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        html{scroll-behavior:smooth;font-size:16px;height:100%}
        body{font-family:'DM Sans',sans-serif;background:var(--surface);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column;height:100%}
        main{flex:1}a{text-decoration:none;color:inherit}img{max-width:100%;display:block}button{cursor:pointer;font-family:'DM Sans',sans-serif}

        /* NAV */
        nav{display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:56px;background:rgba(255,255,255,0.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--card-border);position:sticky;top:0;z-index:100}
        .nav-logo{display:flex;align-items:center;gap:6px;font-family:'Plus Jakarta Sans',sans-serif;font-size:18px;font-weight:700;color:var(--blue)}
        .nav-logo img{height:28px;width:auto}
        .nav-links{display:flex;align-items:center;gap:20px;list-style:none}
        .nav-links a{font-size:13px;font-weight:400;color:var(--ink-muted);transition:color var(--transition)}
        .nav-links a:hover,.nav-links a.active{color:var(--ink)}
        .nav-links a.active{font-weight:500;color:var(--blue)}
        .nav-cta{background:var(--blue);color:#fff;border:none;padding:7px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;transition:background var(--transition);white-space:nowrap}
        .nav-cta:hover{background:var(--blue-dark)}
        .hamburger{display:none;flex-direction:column;gap:5px;justify-content:center;align-items:center;width:44px;height:44px;padding:10px;cursor:pointer;background:none;border:none}
        .hamburger span{display:block;width:20px;height:2px;background:var(--ink);border-radius:2px}
        .mobile-menu{display:none;flex-direction:column;background:var(--white);border-bottom:1px solid var(--card-border);padding:14px 20px 18px;gap:4px;position:sticky;top:56px;z-index:99}
        .mobile-menu.open{display:flex}
        .mobile-menu a{font-size:15px;color:var(--ink-muted);padding:9px 0;border-bottom:1px solid var(--card-border)}
        .mobile-menu a:last-child{border-bottom:none}
        @media(max-width:768px){.nav-links,.nav-cta{display:none}.hamburger{display:flex}}

        /* Trust bar (hidden on mobile) */
        .trust-bar{background:var(--white);border-bottom:1px solid var(--card-border);padding:6px 16px;display:flex;justify-content:center;gap:24px;flex-wrap:wrap;font-size:11px;color:var(--ink-muted)}
        .trust-item{display:flex;align-items:center;gap:5px}
        .trust-item svg{width:12px;height:12px;color:var(--blue)}
        @media(max-width:768px){.trust-bar{display:none}}

        /* HERO */
        .directory-hero{background:linear-gradient(155deg,#eef3f9 0%,#e1e9f4 40%,#f8f9fc 100%);border-bottom:1px solid var(--card-border);padding:22px 16px 18px;text-align:center}
        .hero-tag{display:inline-flex;align-items:center;gap:6px;background:var(--blue-light);color:var(--blue-dark);font-size:11px;font-weight:600;padding:4px 14px;border-radius:100px;margin-bottom:10px;border:1px solid var(--blue-mid)}
        .hero-dot{width:5px;height:5px;border-radius:50%;background:var(--blue);animation:pulse-dot 2s infinite}
        @keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.4;transform:scale(1.6)}}
        .directory-hero h1{font-family:'Plus Jakarta Sans',sans-serif;font-size:26px;font-weight:800;letter-spacing:-0.5px;color:var(--ink);margin-bottom:8px;line-height:1.2}
        .directory-hero h1 em{font-style:normal;color:var(--blue)}
        .hero-bullets{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 18px;font-size:12px;font-weight:400;color:var(--ink-muted);max-width:550px;margin:0 auto 8px;line-height:1.4}
        .hero-bullets span{display:inline-flex;align-items:baseline;gap:4px}
        .hero-bullets .bullet{color:var(--blue);font-weight:700;font-size:14px;line-height:1}
        .hero-note{font-size:11px;color:var(--ink-faint);font-style:italic;margin-top:8px;background:var(--white);display:inline-block;padding:4px 12px;border-radius:100px;border:1px solid var(--card-border)}
        .random-btn{background:var(--white);border:1.5px solid var(--card-border);border-radius:100px;padding:5px 14px;font-size:12px;color:var(--ink-muted);display:inline-flex;align-items:center;gap:5px;cursor:pointer;transition:all var(--transition);margin-top:10px}
        .random-btn:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-light)}

        /* SUGGESTION CHIPS */
        .suggestion-row{text-align:center;margin:12px 0 4px;position:relative;height:32px;overflow:hidden}
        .suggestion-chip{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,0.8);border:1px solid var(--card-border);border-radius:100px;padding:5px 14px;font-size:12px;color:var(--ink-muted);cursor:pointer;position:absolute;left:50%;transform:translateX(-50%);opacity:0;transition:opacity 1.5s ease;white-space:nowrap}
        .suggestion-chip.show{opacity:1}
        .suggestion-chip:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-light)}

        /* FILTER BAR (desktop) */
        .filters-wrap{background:var(--white);border-bottom:2px solid var(--blue-mid);padding:0 16px;position:sticky;top:56px;z-index:50;transition:box-shadow var(--transition)}
        .filters-wrap.scrolled{box-shadow:0 2px 8px rgba(0,0,0,0.05)}
        .filters-label{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.6px;color:var(--blue);margin-right:8px}
        .filters-inner{max-width:1200px;margin:0 auto;display:flex;gap:8px;align-items:center;padding:10px 0;flex-wrap:wrap}
        .filter-search-wrap{flex:1;position:relative;min-width:140px}
        .filter-search-wrap input{width:100%;padding:8px 12px 8px 36px;border:1.5px solid var(--card-border);border-radius:var(--radius-sm);font-size:14px;color:var(--ink);background:var(--surface);outline:none;transition:border-color var(--transition)}
        .filter-search-wrap input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(74,143,212,0.12)}
        .search-icon-inside{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-faint);width:16px;height:16px;pointer-events:none}
        .filter-select{min-width:80px;padding:8px 28px 8px 10px;border:1.5px solid var(--card-border);border-radius:var(--radius-sm);font-size:13px;color:var(--ink);background:var(--surface);outline:none;cursor:pointer;appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%23929a8' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 8px center;transition:border-color var(--transition)}
        .filter-select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(74,143,212,0.12)}
        .filter-clear{display:none;background:none;border:none;color:var(--blue);font-size:12px;font-weight:500;cursor:pointer;padding:6px 8px;border-radius:var(--radius-sm);white-space:nowrap}
        .filter-clear.visible{display:inline-flex}
        .results-count{font-size:12px;color:var(--ink-muted);white-space:nowrap}

        /* MOBILE FILTER BUTTON */
        .filter-toggle-mobile{display:none;background:var(--white);border:1px solid var(--card-border);border-radius:var(--radius-sm);padding:8px 14px;font-size:13px;font-weight:500;color:var(--ink);align-items:center;gap:5px;cursor:pointer}
        .filter-toggle-mobile:hover{background:var(--surface)}
        @media(max-width:768px){
            .filters-inner{display:none}
            .filter-toggle-mobile{display:flex; min-height:44px;}
            .filter-search-wrap{flex:1}
        }

        /* SLIDE-IN FILTER PANEL */
        .filter-panel{position:fixed;top:0;right:-100%;width:300px;max-width:85vw;height:100%;background:var(--white);box-shadow:-4px 0 20px rgba(0,0,0,0.15);z-index:200;transition:right 0.3s ease;padding:24px 20px;overflow-y:auto}
        .filter-panel.open{right:0}
        .filter-panel .panel-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
        .filter-panel .panel-header h3{font-family:'Plus Jakarta Sans',sans-serif;font-size:18px;font-weight:700}
        .filter-panel .close-btn{background:none;border:none;font-size:24px;cursor:pointer;color:var(--ink-muted)}
        .filter-panel .filter-select,.filter-panel input{width:100%;margin-bottom:12px}
        .overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.3);z-index:199;display:none}
        .overlay.show{display:block}

        /* LISTINGS GRID */
        .listings-section{max-width:1200px;margin:0 auto;padding:16px 16px 48px}
        .listings-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
        @media(max-width:1024px){.listings-grid{grid-template-columns:repeat(2,1fr);gap:12px}}
        @media(max-width:600px){
            .listings-grid{grid-template-columns:repeat(2,1fr);gap:6px}
            .listing-card .card-comment-area{height:100px;padding:12px 10px}
            .comment-text{font-size:10px;line-height:1.4;-webkit-line-clamp:3;padding:0 6px}
            .comment-quote{font-size:28px;top:4px;left:4px}
            .no-comment{font-size:10px}
            .badge-real,.badge-new,.badge-also-looking{font-size:7px;padding:2px 6px}
            .badge-also-looking{font-size:7px;padding:2px 6px}
            .card-save {
                width: 44px;
                height: 44px;
                top: 5px;
                left: 5px;
                font-size: 18px;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .card-body{padding:6px 8px;gap:2px}
            .card-ref{font-size:8px}
            .card-type{font-size:12px;line-height:1.2;margin-bottom:2px}
            .card-location-row{margin-top:0;gap:4px}
            .card-location-tag{font-size:9px;padding:2px 6px}
            .card-rent{font-size:14px}
            .card-rent span{font-size:8px}
            .card-tags{display:none}
            .card-footer{padding:5px 8px;border-top:none}
            .card-date{font-size:8px}
            .card-btn {
                font-size: 12px;
                padding: 8px 16px;
                border-radius: 20px;
                min-height: 44px;
                display: inline-flex;
                align-items: center;
                justify-content: center;
            }
            .type-silhouette{font-size:50px;bottom:-4px;right:-4px}
            .listing-card{border-radius:var(--radius)}
            .card-tint-mainland,.card-tint-island{border-top-width:2px}
            .load-more-btn {
                min-height: 44px;
                padding: 12px 24px;
                font-size: 14px;
            }
        }

        .listing-card{background:var(--white);border-radius:var(--radius-lg);border:1px solid var(--card-border);overflow:hidden;transition:box-shadow var(--transition),transform var(--transition);cursor:pointer;display:flex;flex-direction:column;position:relative;box-shadow:var(--card-shadow)}
        .listing-card:hover{box-shadow:var(--card-shadow-hover);transform:translateY(-3px)}
        .card-tint-mainland{border-top:3px solid #eab308}
        .card-tint-island{border-top:3px solid #06b6d4}
        .card-comment-area{height:130px;background:linear-gradient(145deg,#d9e4f0 0%,#c5d6e8 50%,#d0dceb 100%);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:18px 14px}
        .comment-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(to top,rgba(0,0,0,0.08) 0%,transparent 55%);z-index:1}
        .comment-text{font-size:13px;line-height:1.55;color:#1a2634;font-style:italic;text-align:center;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;position:relative;z-index:2}
        .comment-quote{position:absolute;top:6px;left:8px;font-size:34px;color:rgba(24,95,165,0.10);font-family:'Georgia',serif;line-height:1;z-index:0}
        .no-comment{color:#7a8a9e;font-size:12px;font-style:normal}
        .badge-real{position:absolute;top:8px;right:8px;background:rgba(255,255,255,0.9);border-radius:100px;padding:3px 9px;font-size:9px;font-weight:600;color:var(--green-dark);display:flex;align-items:center;gap:3px;z-index:3;border:1px solid rgba(39,80,10,0.12)}
        .badge-new{position:absolute;top:8px;right:8px;background:var(--green-light);color:var(--green-dark);border-radius:100px;padding:3px 9px;font-size:9px;font-weight:700;z-index:3;border:1px solid rgba(39,80,10,0.15)}
        .badge-also-looking{position:absolute;top:8px;right:8px;background:#dbeafe;color:#1e40af;border-radius:100px;padding:3px 9px;font-size:9px;font-weight:700;z-index:3;border:1px solid #bfdbfe}
        .card-save{position:absolute;top:8px;left:8px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,0.9);border:1px solid rgba(0,0,0,0.06);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all var(--transition);z-index:3;font-size:12px}
        .card-save:hover{background:#fff;transform:scale(1.08)}
        .card-save.saved{color:#e74c3c;border-color:#fecaca}
        .type-silhouette{position:absolute;bottom:-6px;right:-6px;font-size:76px;color:rgba(24,95,165,0.06);pointer-events:none;z-index:0;line-height:1;font-family:'Plus Jakarta Sans',sans-serif}
        .card-body{padding:12px 14px;flex:1;display:flex;flex-direction:column;gap:6px}
        .card-ref{font-size:10px;font-weight:600;color:var(--blue);text-transform:uppercase;letter-spacing:0.6px}
        .card-type{font-family:'Plus Jakarta Sans',sans-serif;font-size:15px;font-weight:700;color:var(--ink);line-height:1.2}
        .card-location-row{display:flex;align-items:center;gap:6px;margin-top:2px}
        .card-location-tag{display:inline-flex;align-items:center;gap:4px;background:var(--surface);border-radius:100px;padding:3px 10px;font-size:11px;font-weight:500;color:var(--ink-muted);border:1px solid var(--card-border)}
        .card-rent{font-family:'Plus Jakarta Sans',sans-serif;font-size:18px;font-weight:700;color:var(--ink);letter-spacing:-0.3px;margin-top:2px}
        .card-rent span{font-size:10px;color:var(--ink-muted);font-weight:500;margin-left:2px}
        .card-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
        .badge-icon{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:8px;font-size:10px;font-weight:500;color:var(--ink);background:var(--surface);border:1px solid var(--card-border)}
        .badge-icon .icon-circle{width:18px;height:18px;border-radius:50%;background:var(--white);display:flex;align-items:center;justify-content:center;font-size:12px}
        .badge-light .icon-circle{color:#b45309;background:var(--orange-light)}
        .badge-water .icon-circle{color:var(--blue-dark);background:var(--blue-light)}
        .badge-parking .icon-circle{color:#6d28d9;background:var(--purple-light)}
        .badge-status .icon-circle{color:var(--green-dark);background:var(--green-light)}
        .card-footer{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-top:1px solid var(--card-border);gap:6px}
        .card-date{font-size:10px;color:var(--ink-faint)}
        .card-btn{font-size:11px;font-weight:600;color:var(--white);background:var(--blue);border:none;padding:5px 14px;border-radius:20px;transition:all var(--transition);white-space:nowrap}
        .card-btn:hover{background:var(--blue-dark);transform:scale(1.03)}

        .load-more-btn {
            display: block;
            margin: 16px auto 0;
            padding: 10px 28px;
            background: var(--white);
            border: 1.5px solid var(--card-border);
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 600;
            color: var(--ink);
            cursor: pointer;
            transition: all var(--transition);
        }
        .load-more-btn:hover {
            border-color: var(--blue);
            color: var(--blue);
            background: var(--blue-light);
        }

        /* DETAIL PAGE */
        .detail-page{max-width:900px;margin:0 auto;padding:24px 16px 40px}
        .detail-back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-muted);cursor:pointer;background:none;border:none;margin-bottom:20px}
        .detail-comment-hero{background:linear-gradient(145deg,#d9e4f0 0%,#c5d6e8 50%,#d0dceb 100%);border-radius:var(--radius-lg);padding:36px 28px;margin-bottom:20px;position:relative;overflow:hidden}
        .detail-comment-hero .detail-quote{position:absolute;top:8px;left:16px;font-size:52px;color:rgba(24,95,165,0.08);font-family:'Georgia',serif;line-height:1;z-index:0}
        .detail-comment-hero .detail-comment-body{font-size:16px;line-height:1.7;color:#1a2634;font-style:italic;text-align:center;position:relative;z-index:1}
        .no-comment-detail{color:#7a8a9e;font-size:15px;font-style:normal}
        .detail-comment-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.6px;color:var(--blue-dark);margin-bottom:8px;text-align:center}
        .detail-summary{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:20px;align-items:flex-start}
        .detail-photo-wrap{flex:0 0 280px;max-width:280px;aspect-ratio:4/3;border-radius:var(--radius-lg);overflow:hidden;background:var(--surface);border:1px solid var(--card-border);display:flex;align-items:center;justify-content:center}
        .detail-photo-wrap img{width:100%;height:100%;object-fit:cover}
        .detail-info{flex:1;min-width:220px}
        .detail-ref{font-size:11px;font-weight:600;color:var(--blue);text-transform:uppercase;margin-bottom:4px;opacity:0.8}
        .detail-info h1{font-family:'Plus Jakarta Sans',sans-serif;font-size:26px;font-weight:800;color:var(--ink);margin-bottom:6px;line-height:1.2}
        .detail-loc{font-size:14px;color:var(--ink-muted);margin-bottom:12px;display:flex;align-items:center;gap:6px}
        .detail-rent{font-family:'Plus Jakarta Sans',sans-serif;font-size:26px;font-weight:700;color:var(--ink);margin-bottom:16px}
        .detail-rent span{font-size:14px;color:var(--ink-muted);font-weight:500}
        .detail-actions{display:flex;gap:8px;flex-wrap:wrap}
        .btn-primary{display:inline-flex;align-items:center;gap:6px;padding:11px 22px;background:var(--blue);color:#fff;border:none;border-radius:var(--radius);font-size:13px;font-weight:600;box-shadow:0 2px 8px rgba(74,143,212,0.25)}
        .btn-primary:hover{background:var(--blue-dark);transform:translateY(-1px)}
        .btn-outline{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;background:var(--white);color:var(--ink);border:1.5px solid var(--card-border);border-radius:var(--radius);font-size:12px;font-weight:500}
        .btn-outline:hover{border-color:var(--ink-muted);background:var(--surface)}
        .detail-section{background:var(--white);border:1px solid var(--card-border);border-radius:var(--radius-lg);padding:22px 26px;margin-bottom:16px}
        .detail-section h2{font-family:'Plus Jakarta Sans',sans-serif;font-size:17px;font-weight:700;color:var(--ink);margin-bottom:18px}
        .detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
        .detail-item{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--surface);border-radius:var(--radius-sm);border:1px solid var(--card-border)}
        .detail-item-icon{font-size:17px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;background:var(--white);border-radius:8px;color:var(--blue);flex-shrink:0;border:1px solid var(--card-border)}
        .detail-item-content{font-size:13px;color:var(--ink)}
        .detail-item-content .item-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:var(--ink-faint);margin-bottom:2px}
        .detail-item-content .item-value{font-weight:600}
        .detail-comments-original{margin-top:24px;padding-top:16px;border-top:1px solid var(--card-border);font-size:14px;color:var(--ink-muted);line-height:1.7}
        .similar-section{margin-top:28px}
        .similar-section h2{font-family:'Plus Jakarta Sans',sans-serif;font-size:17px;font-weight:700;color:var(--ink);margin-bottom:12px}
        .similar-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
        .unavailable-banner{background:var(--orange-light);border:1px solid #fbbf24;border-radius:var(--radius);padding:14px 18px;text-align:center;margin-bottom:16px}
        .countdown{font-size:12px;color:var(--ink-muted);margin-top:6px}

        /* MODAL */
        .modal{display:none;position:fixed;z-index:300;left:0;top:0;width:100%;height:100%;overflow:auto;background-color:rgba(0,0,0,0.5);align-items:center;justify-content:center}
        .modal.active{display:flex}
        .modal-content{background:var(--white);border-radius:var(--radius-lg);padding:28px 24px;max-width:500px;width:90%;max-height:90vh;overflow-y:auto;position:relative;animation:fadeUp 0.3s ease}
        .modal-close{position:absolute;top:12px;right:16px;font-size:22px;background:none;border:none;cursor:pointer;color:var(--ink-muted)}
        .modal-close:hover{color:var(--ink)}

        /* Form inside modal */
        .intro-form-wrap{background:transparent;padding:0;margin:0;border:none}
        .form-group{margin-bottom:12px}
        .form-group label{display:block;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:var(--ink-muted);margin-bottom:4px}
        .form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 14px;border:1.5px solid var(--card-border);border-radius:var(--radius-sm);font-size:14px;color:var(--ink);background:var(--surface);outline:none;transition:border-color var(--transition)}
        .form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(74,143,212,0.12)}
        .form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
        .btn-submit-request{width:100%;padding:13px;background:var(--blue);color:#fff;border:none;border-radius:var(--radius);font-size:14px;font-weight:600;cursor:pointer;transition:background var(--transition);margin-top:6px}
        .btn-submit-request:hover{background:var(--blue-dark)}
        .btn-submit-request:disabled{opacity:0.5;cursor:not-allowed}
        .request-confirmation{text-align:center;padding:26px 20px}

        .recently-viewed{max-width:1200px;margin:0 auto 0;padding:0 16px 16px}
        .recently-viewed h3{font-size:12px;font-weight:600;color:var(--ink-muted);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:8px}
        .rv-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
        .rv-card{flex:0 0 150px;background:var(--white);border:1px solid var(--card-border);border-radius:var(--radius);padding:8px 10px;cursor:pointer;scroll-snap-align:start;transition:box-shadow var(--transition)}
        .rv-card:hover{box-shadow:var(--card-shadow-hover)}
        .rv-ref{font-size:10px;font-weight:600;color:var(--blue);text-transform:uppercase}
        .rv-type{font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:700;color:var(--ink);margin:2px 0}
        .rv-rent{font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:700;color:var(--ink)}
        footer{padding:16px;text-align:center;font-size:11px;color:var(--ink-faint);border-top:1px solid var(--card-border);background:var(--white)}
    </style>
</head>

    <!-- INTRODUCTION MODAL -->
    <div id="introModal" class="modal">
        <div class="modal-content" id="introModalContent"></div>
    </div>

    <script>
        const CONFIG = {
            GAS_URL: 'https://script.google.com/macros/s/AKfycbyHby_E7i0Bc4CZuQBhyJzcp-FSUVUq_z1rxl63uTzNd9FdpgW5ZK0TY_V9l4D3180CWQ/exec',
            ITEMS_PER_PAGE: 12, DEBOUNCE_MS: 250
        };
        const state = {
            allListings: [], filteredListings: [], displayedCount: 0,
            currentDetailId: null, currentDetailData: null,
            filters: { area: '', aptType: '', location: '', residentStatus: '' },
            savedListings: JSON.parse(localStorage.getItem('rp_saved') || '[]'),
            recentlyViewed: JSON.parse(localStorage.getItem('rp_recent') || '[]')
        };

        function formatNaira(n){if(!n||isNaN(n))return'—';return'₦'+parseInt(n).toLocaleString('en-NG')}
        function timeAgo(d){if(!d)return'';const n=new Date(),t=new Date(d),e=n-t,a=Math.floor(e/864e5);if(a<0)return'Just now';if(a===0)return'Today';if(a===1)return'1d ago';if(a<7)return a+'d ago';if(a<30)return Math.floor(a/7)+'w ago';if(a<365)return Math.floor(a/30)+'mo ago';return Math.floor(a/365)+'y ago'}
        function debounce(fn,ms){let t;return function(...a){clearTimeout(t);t=setTimeout(()=>fn.apply(this,a),ms)}}
        function getRentNumeric(s){if(!s)return 0;const n=parseInt(s.replace(/[^0-9]/g,''));return isNaN(n)?0:n}
        function showToast(m,t='success'){const c=document.getElementById('toast-container');const d=document.createElement('div');d.className='toast '+(t==='success'?'success':'error');d.textContent=m;c.appendChild(d);setTimeout(()=>d.remove(),2800)}
        function toggleSaveListing(id){const i=state.savedListings.indexOf(id);if(i>-1){state.savedListings.splice(i,1);showToast('Unsaved')}else{state.savedListings.push(id);showToast('Saved!')}localStorage.setItem('rp_saved',JSON.stringify(state.savedListings));refreshCurrentView()}
        function addToRecentlyViewed(l){const e=state.recentlyViewed.find(r=>r.listingId===l.listingId);if(e){state.recentlyViewed=[e,...state.recentlyViewed.filter(r=>r.listingId!==l.listingId)]}else{state.recentlyViewed.unshift({listingId:l.listingId,apartmentType:l.apartmentType,area:l.area,location:l.location,rentExact:l.rentExact});if(state.recentlyViewed.length>10)state.recentlyViewed.pop()}localStorage.setItem('rp_recent',JSON.stringify(state.recentlyViewed))}
        function isSaved(id){return state.savedListings.indexOf(id)>-1}
        function escapeHTML(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

        async function apiFetch(a,p={},m='GET'){
            const u=new URL(CONFIG.GAS_URL);u.searchParams.set('action',a);
            if(m==='GET')Object.entries(p).forEach(([k,v])=>u.searchParams.set(k,v));
            try{const o={method:m};if(m==='POST'){o.body=JSON.stringify(p);o.headers={'Content-Type':'application/json'}}const r=await fetch(u.toString(),o);if(!r.ok)throw new Error('API error');return await r.json()}catch(e){console.warn('API fail, mock',e);return getMockResponse(a,p)}
        }
        function getMockResponse(a,p){
            if(a==='listings')return{success:true,listings:getMockListings()};
            if(a==='listing'&&p.id){const l=getMockListings().find(l=>l.listingId===p.id);return{success:true,listing:l||null}}
            if(a==='requestIntroduction')return{success:true,requestId:'REQ'+Date.now(),message:'OK',status:'pending'};
            return{success:false}
        }
        function getMockListings(){
            const areas=['Yaba','Surulere','Ikeja','Lekki Phase 1','Ajah','Ikoyi','Victoria Island','Gbagada','Ogba','Magodo','Maryland','Ojodu','Egbeda','Ipaja','Ketu','Onipanu'];
            const apts=['Self contain','Mini flat / 1 bedroom','Mini flat / 1 bedroom','2 bedroom flat','3 bedroom flat'];
            const lights=['Band A','Band B','Band C','Band D','No light'];
            const waters=['Running water','Water but not running','No water'];
            const parks=['Compound parking','Parking nearby, not in compound','Street parking only','No parking'];
            const statuses=['Still living there','Packing out within 1 month','Packing out in 1-3 months','Already packed out'];
            const list=[];
            for(let i=1;i<=24;i++){
                const id='RP'+String(i).padStart(4,'0'), area=areas[i%areas.length];
                const loc=area.includes('Lekki')||area.includes('Ajah')||area.includes('Ikoyi')||area.includes('Victoria Island')?'Island':'Mainland';
                const apt=apts[i%apts.length];
                const listingType=i%3===0?'both':'packing';
                const rr=[{min:4e5,max:6e5},{min:7e5,max:9e5},{min:1e6,max:15e5},{min:16e5,max:2e6},{min:21e5,max:3e6},{min:31e5,max:4e6},{min:41e5,max:5e6},{min:5e6,max:7e6}][i%8];
                const rent=Math.round((rr.min+Math.random()*(rr.max-rr.min))/5e4)*5e4;
                const days=Math.floor(Math.random()*45)+1;
                const comment=i%4===0?'Spacious with good natural light. Quiet neighbours.':i%4===1?'Close to main road, solid security.':i%4===2?'Recently repainted, responsive landlord.':'Well-kept compound with parking.';
                const bldgSize=['4 units','6 units','8 units','','12 units',''][i%6];
                const bldgCond=['Well maintained','Fairly maintained','','Newly built','',''][i%6];
                list.push({listingId:id,urlSlug:apt.toLowerCase().replace(/[\/ ]/g,'-')+'-'+area.toLowerCase().replace(/ /g,'-')+'-'+id,apartmentType:apt,area,location:loc,rentRange:formatNaira(rr.min)+' – '+formatNaira(rr.max),rentExact:rent,rentMin:rr.min,rentMax:rr.max,light:lights[i%5],water:waters[i%3],parking:parks[i%4],residentStatus:statuses[i%4],postedDate:new Date(Date.now()-days*864e5).toISOString().split('T')[0],photosAvailable:'No',primaryPhoto:'',buildingSize:bldgSize,buildingCondition:bldgCond,timeStayed:'2 years',comments:comment,views:Math.floor(Math.random()*200)+10,verificationStatus:'Verified',listingStatus:'Available',listingType:listingType})
            }
            return list;
        }

        function getRouteInfo(){const p=window.location.pathname;const m=p.match(/^\/listings\/(RP[-]?[\w]+)\/?$/i);if(m)return{view:'detail',listingId:m[1].toUpperCase()};if(p==='/listings'||p==='/listings/')return{view:'directory'};const q=new URLSearchParams(window.location.search);const id=q.get('id');if(id&&/^RP[-]?[\w]+$/i.test(id))return{view:'detail',listingId:id.toUpperCase()};return{view:'directory'}}
        function navigateTo(u,push=true){if(push)history.pushState(null,'',u);handleRoute();window.scrollTo({top:0,behavior:'smooth'})}
        async function handleRoute(){const r=getRouteInfo();const m=document.getElementById('app-main');if(r.view==='directory'){state.currentDetailId=null;state.currentDetailData=null;await renderDirectory(m)}else{state.currentDetailId=r.listingId;await renderDetail(m,r.listingId)}}
        window.addEventListener('popstate',handleRoute);

        async function renderDirectory(container){
            container.innerHTML=getDirectorySkeletonHTML();
            let data;try{data=await apiFetch('listings')}catch(e){data={success:true,listings:getMockListings()}}
            let all=(data.listings||[]).filter(l=>l.verificationStatus==='Verified'&&l.listingStatus==='Available');
            all.sort((a,b)=>new Date(b.postedDate)-new Date(a.postedDate));
            state.allListings=all;state.filteredListings=[...all];state.displayedCount=Math.min(CONFIG.ITEMS_PER_PAGE,all.length);
            container.innerHTML=getDirectoryHTML();
            populateFilterOptions();applyFilters();renderCards();renderRecentlyViewed();bindEvents();updateCount();updateClearButton();
            startSuggestionCycle();startAutoRefresh();
        }
        function getDirectorySkeletonHTML(){let s='';for(let i=0;i<8;i++)s+=`<div class="skeleton-card"><div class="skeleton-photo"></div><div class="skeleton-body"><div class="skeleton-line short"></div><div class="skeleton-line med"></div><div class="skeleton-line long"></div></div></div>`;return`<div class="directory-hero"><div class="hero-tag"><div class="hero-dot"></div>Available houses</div><h1>Available <em>Apartments</em></h1><div class="hero-bullets"><span><span class="bullet">•</span>Verified listings</span><span><span class="bullet">•</span>Request introduction</span><span><span class="bullet">•</span>Resident approves</span></div></div><div class="listings-section"><div class="listings-grid">${s}</div></div>`}
        function getDirectoryHTML(){return `
            <div class="directory-hero">
                <div class="hero-tag"><div class="hero-dot"></div>Available houses</div>
                <h1>Available <em>Apartments</em></h1>
                <div class="hero-bullets">
                    <span><span class="bullet">•</span> Verified listings</span>
                    <span><span class="bullet">•</span> Request an introduction</span>
                    <span><span class="bullet">•</span> Resident approves — then you proceed</span>
                </div>
                <p class="hero-note">⚠️ These apartments have not been confirmed unavailable by their tenants — availability may change.</p>
                <div class="suggestion-row" id="suggestion-row"></div>
                <button class="random-btn" id="random-btn">🎲 Random</button>
            </div>
            <div class="listings-section">
                <div class="listings-grid" id="listings-grid"></div>
                <div class="pagination-wrap" id="pagination-wrap"></div>
                <div class="empty-state" id="empty-state" style="display:none">
                    <svg viewBox="0 0 80 80" width="48" height="48"><rect x="15" y="25" width="50" height="38" rx="4" stroke="currentColor" stroke-width="2.5" fill="none"/><line x1="22" y1="34" x2="58" y2="34" stroke="currentColor" stroke-width="2"/></svg>
                    <h3>No listings match</h3><p>Try adjusting your filters.</p>
                </div>
            </div>`;}

        const suggestions=['3 bedroom in Lekki','2 bedroom in Surulere','Self contain in Yaba','Mini flat in Ikoyi','1 bedroom in Ajah','2 bedroom in Gbagada'];
        let suggestionIndex=0,suggestionTimeout=null;
        function startSuggestionCycle(){const row=document.getElementById('suggestion-row');if(!row)return;row.innerHTML=`<button class="suggestion-chip" id="suggestion-chip">${suggestions[0]}</button>`;const chip=document.getElementById('suggestion-chip');chip.classList.add('show');chip.addEventListener('click',()=>{document.getElementById('filter-search').value=chip.textContent;applyFilters();renderCards()});let idx=1;function next(){chip.classList.remove('show');suggestionTimeout=setTimeout(()=>{chip.textContent=suggestions[idx%suggestions.length];idx++;chip.classList.add('show');suggestionTimeout=setTimeout(next,12000)},1200)}suggestionTimeout=setTimeout(next,6000)}
        window.addEventListener('beforeunload',()=>{if(suggestionTimeout)clearTimeout(suggestionTimeout)});

        function populateFilterOptions(){const areas=[...new Set(state.allListings.map(l=>l.area))].sort();const areaSelect=document.getElementById('filter-area');areaSelect.innerHTML='<option value="">📍 Area</option>';areas.forEach(a=>{const opt=document.createElement('option');opt.value=a;opt.textContent=a;areaSelect.appendChild(opt)})}
        function applyFilters(){
            let filtered=[...state.allListings];
            const f=state.filters;
            const search=(document.getElementById('filter-search')?.value||'').toLowerCase().trim();
            if(search){filtered=filtered.filter(l=>(l.listingId||'').toLowerCase().includes(search)||(l.area||'').toLowerCase().includes(search)||(l.apartmentType||'').toLowerCase().includes(search)||(l.location||'').toLowerCase().includes(search)||(l.comments||'').toLowerCase().includes(search))}
            if(f.area)filtered=filtered.filter(l=>l.area===f.area);
            if(f.aptType)filtered=filtered.filter(l=>{const at=l.apartmentType||'';if(f.aptType==='Mini flat / 1 bedroom')return at.includes('Mini flat')||at.includes('1 bedroom');return at===f.aptType});
            if(f.location)filtered=filtered.filter(l=>l.location===f.location);
            if(f.residentStatus)filtered=filtered.filter(l=>l.residentStatus===f.residentStatus);
            state.filteredListings=filtered;state.displayedCount=Math.min(CONFIG.ITEMS_PER_PAGE,filtered.length);
            updateClearButton();updateCount();
        }
        function updateClearButton(){const anyActive=Object.values(state.filters).some(v=>v!=='')||(document.getElementById('filter-search')?.value||'').trim()!=='';document.getElementById('filter-clear').style.display=anyActive?'inline-flex':'none';}
        function renderCards(){
            const grid=document.getElementById('listings-grid'),empty=document.getElementById('empty-state'),pag=document.getElementById('pagination-wrap');
            if(!grid)return;
            const visible=state.filteredListings.slice(0,state.displayedCount);
            if(state.filteredListings.length===0){grid.innerHTML='';if(empty)empty.style.display='block';if(pag)pag.innerHTML='';return}
            if(empty)empty.style.display='none';
            grid.innerHTML=visible.map(l=>getCardHTML(l)).join('');
            if(pag&&state.displayedCount<state.filteredListings.length){pag.innerHTML=`<button class="load-more-btn" id="load-more-btn">Load More</button>`}
            else if(pag&&state.filteredListings.length>CONFIG.ITEMS_PER_PAGE){pag.innerHTML='<span style="font-size:12px;color:var(--ink-faint)">All loaded</span>'}
            else{if(pag)pag.innerHTML=''}
            updateCount();
        }
        function getCardHTML(l){
            const saved=isSaved(l.listingId);
            const comment=l.comments&&l.comments.trim()?l.comments:null;
            const commentHTML=comment?`<div class="comment-quote">"</div><div class="comment-text">${escapeHTML(comment)}</div>`:`<div class="comment-text no-comment">📝 No description yet — tap to view details</div>`;
            const isNew=new Date(l.postedDate)>new Date(Date.now()-2*86400000);
            const tintClass=l.location==='Mainland'?'card-tint-mainland':'card-tint-island';
            const silhouettes={'Self contain':'🛏️','Mini flat / 1 bedroom':'🛋️','2 bedroom flat':'🛏️🛏️','3 bedroom flat':'🛏️🛏️🛏️'};
            const typeSilhouette=silhouettes[l.apartmentType]||'🏠';
            const alsoLookingBadge=(l.listingType==='both')?'<div class="badge-also-looking">🔍 Also looking</div>':'';
            const newBadge=isNew?'<div class="badge-new">New</div>':'';
            const locDisplay=l.location==='Mainland'?'📍 Mainland':'🏝️ Island';
            const savedIcon=saved?'❤️':'🤍';
            const tags=[`<div class="badge-icon badge-light"><span class="icon-circle">⚡</span>${escapeHTML(l.light)}</div>`,`<div class="badge-icon badge-water"><span class="icon-circle">💧</span>${escapeHTML(l.water)}</div>`,`<div class="badge-icon badge-parking"><span class="icon-circle">🅿️</span>${escapeHTML(l.parking)}</div>`,`<div class="badge-icon badge-status"><span class="icon-circle">📅</span>${escapeHTML(l.residentStatus)}</div>`];
            if(l.buildingSize)tags.push(`<div class="badge-icon"><span class="icon-circle">🏢</span>${escapeHTML(l.buildingSize)}</div>`);
            if(l.buildingCondition)tags.push(`<div class="badge-icon"><span class="icon-circle">🔨</span>${escapeHTML(l.buildingCondition)}</div>`);
            return `
            <div class="listing-card ${tintClass}" onclick="goToDetail('${l.listingId}')">
                <div class="card-comment-area">
                    <div class="type-silhouette">${typeSilhouette}</div>
                    <div class="comment-overlay"></div>
                    ${commentHTML}
                    ${alsoLookingBadge}
                    ${newBadge}
                    <div class="badge-real"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg> Real</div>
                    <button class="card-save ${saved?'saved':''}" onclick="event.stopPropagation();toggleSaveListing('${l.listingId}')" title="${saved?'Remove from saved':'Save listing'}">${savedIcon}</button>
                </div>
                <div class="card-body">
                    <span class="card-ref">${l.listingId} · ${timeAgo(l.postedDate)}</span>
                    <div class="card-type">${escapeHTML(l.apartmentType)}</div>
                    <div class="card-location-row">
                        <span class="card-location-tag">${locDisplay} ${escapeHTML(l.area)}</span>
                    </div>
                    <div class="card-rent">${formatNaira(l.rentExact)}<span>/year</span></div>
                    <div class="card-tags">${tags.join('')}</div>
                </div>
                <div class="card-footer">
                    <span class="card-date">Posted ${timeAgo(l.postedDate)}</span>
                    <button class="card-btn" onclick="event.stopPropagation();goToDetail('${l.listingId}')">View →</button>
                </div>
            </div>`;
        }

        function renderRecentlyViewed(){
            const wrap=document.getElementById('recently-viewed-wrap');if(!wrap)return;
            if(state.recentlyViewed.length===0){wrap.style.display='none';return}
            wrap.style.display='block';
            wrap.innerHTML=`<h3>Recently Viewed</h3><div class="rv-scroll">${state.recentlyViewed.map(r=>`<div class="rv-card" onclick="goToDetail('${r.listingId}')"><span class="rv-ref">${r.listingId}</span><div class="rv-type">${escapeHTML(r.apartmentType)}</div><div class="rv-rent">${formatNaira(r.rentExact)}/yr</div><span style="font-size:10px;color:var(--ink-faint)">${escapeHTML(r.area)}</span></div>`).join('')}</div>`;
        }
        function updateCount(){const el=document.getElementById('results-count');if(!el)return;const t=state.filteredListings.length;el.textContent=`${Math.min(state.displayedCount,t)}/${t}`}

        function bindEvents(){
            document.getElementById('filter-search').addEventListener('input',debounce(()=>{applyFilters();renderCards()},CONFIG.DEBOUNCE_MS));
            document.getElementById('filter-area').addEventListener('change',function(){state.filters.area=this.value;applyFilters();renderCards()});
            document.getElementById('filter-apt-type').addEventListener('change',function(){state.filters.aptType=this.value;applyFilters();renderCards()});
            document.getElementById('filter-location').addEventListener('change',function(){state.filters.location=this.value;applyFilters();renderCards()});
            document.getElementById('filter-resident-status').addEventListener('change',function(){state.filters.residentStatus=this.value;applyFilters();renderCards()});
            document.getElementById('filter-clear').addEventListener('click',()=>{
                state.filters={area:'',aptType:'',location:'',residentStatus:''};
                document.getElementById('filter-search').value='';
                document.querySelectorAll('.filter-select').forEach(s=>s.value='');
                applyFilters();renderCards();showToast('Filters cleared')
            });
            document.getElementById('load-more-btn')?.addEventListener('click',()=>{state.displayedCount=Math.min(state.displayedCount+CONFIG.ITEMS_PER_PAGE,state.filteredListings.length);renderCards()});
            document.getElementById('random-btn')?.addEventListener('click',()=>{if(state.allListings.length)goToDetail(state.allListings[Math.floor(Math.random()*state.allListings.length)].listingId)});
        }

        // ── DELEGATED MODAL TRIGGER ──
        document.addEventListener('click', function(e) {
            const btn = e.target.closest('.btn-primary[data-action="intro"]');
            if (btn) {
                const listingId = btn.getAttribute('data-listing-id');
                openIntroductionModal(listingId);
            }
        });

        // ── DETAIL PAGE (the button has data-action="intro") ──
        async function renderDetail(container,listingId){
            container.innerHTML=`<div class="detail-page"><div class="skeleton-line short" style="width:80px;margin-bottom:20px"></div><div class="skeleton-photo" style="height:200px;margin-bottom:16px"></div><div class="skeleton-line short"></div><div class="skeleton-line med"></div><div class="skeleton-line long"></div></div>`;
            let data;try{data=await apiFetch('listing',{id:listingId})}catch(e){data={success:true,listing:getMockListings().find(l=>l.listingId===listingId)||null}}
            const listing=data.listing;
            if(!listing){container.innerHTML=`<div class="detail-page" style="text-align:center;padding:60px"><h2>Listing not found</h2><p style="color:var(--ink-muted)">This listing may have been removed.</p><a href="/listings" style="color:var(--blue);font-weight:600">← Back to listings</a></div>`;return}
            state.currentDetailData=listing;addToRecentlyViewed(listing);
            if(listing.listingStatus!=='Available'){container.innerHTML=`<div class="detail-page" style="text-align:center;padding:60px"><div class="unavailable-banner"><h3>This apartment is no longer available</h3><p>The resident has marked it as taken off the market.</p></div><a href="/listings" style="color:var(--blue);font-weight:600">← Browse other listings</a></div>`;return}
            container.innerHTML=getDetailHTML(listing);
            loadSimilarListings(listing);
        }

        function getDetailHTML(l){
            const photoHTML=l.photosAvailable==='Yes'&&l.primaryPhoto?`<img src="${l.primaryPhoto}" alt="${l.apartmentType}">`:`<div class="no-photo-placeholder" style="text-align:center;color:var(--ink-faint);padding:20px">No photo available</div>`;
            const commentHero=l.comments?`<div class="detail-comment-hero"><div class="detail-comment-label">Comment from resident</div><div class="detail-quote">"</div><div class="detail-comment-body">${escapeHTML(l.comments)}</div></div>`:'';
            const fields=[{label:'Rent',value:formatNaira(l.rentExact)+'/year',icon:'💰'},{label:'Light',value:l.light,icon:'💡'},{label:'Water',value:l.water,icon:'🚿'},{label:'Parking',value:l.parking,icon:'🅿️'},{label:'Building Size',value:l.buildingSize,icon:'🏢'},{label:'Condition',value:l.buildingCondition,icon:'🔨'},{label:'Stayed',value:l.timeStayed,icon:'⏱️'},{label:'Status',value:l.residentStatus,icon:'📅'}].filter(f=>f.value&&f.value.trim()!=='');
            return `<div class="detail-page"><button class="detail-back" onclick="goToDirectory()">← Back to listings</button>${commentHero}<div class="detail-summary"><div class="detail-photo-wrap">${photoHTML}</div><div class="detail-info"><span class="detail-ref">${l.listingId}</span><h1>${l.apartmentType}</h1><div class="detail-loc">📍 ${l.area}, ${l.location}</div><div class="detail-rent">${formatNaira(l.rentExact)}<span>/year</span></div><div class="detail-actions"><button class="btn-primary" data-action="intro" data-listing-id="${l.listingId}">Request Introduction</button><button class="btn-outline" onclick="copyListingLink('${l.listingId}')">Copy Link</button><button class="btn-outline" onclick="shareListing('${l.listingId}','${l.apartmentType} in ${l.area}')">Share</button></div></div></div><div class="detail-section"><h2>Apartment Details</h2><div class="detail-grid">${fields.map(f=>`<div class="detail-item"><div class="detail-item-icon">${f.icon}</div><div class="detail-item-content"><div class="item-label">${f.label}</div><div class="item-value">${escapeHTML(f.value)}</div></div></div>`).join('')}</div>${l.comments?`<div class="detail-comments-original"><span class="field-label">Resident's comment</span><p>${l.comments}</p></div>`:''}</div><div class="similar-section"><h2>Similar Listings</h2><div class="similar-grid" id="similar-grid"></div></div></div>`;
        }

        // ── MODAL LOGIC ──
        function openIntroductionModal(listingId) {
            const modal = document.getElementById('introModal');
            const content = document.getElementById('introModalContent');
            content.innerHTML = getIntroductionFormHTML(listingId);
            modal.classList.add('active');
            // Bind form submit
            document.getElementById('intro-request-form').addEventListener('submit', (e) => submitIntroductionRequest(e, listingId));
        }

        function closeModal() {
            document.getElementById('introModal').classList.remove('active');
        }

        window.addEventListener('click', (e) => {
            if (e.target === document.getElementById('introModal')) closeModal();
        });

        function getIntroductionFormHTML(listingId) {
            return `
            <button class="modal-close" onclick="closeModal()">✕</button>
            <h2>Request Introduction</h2>
            <p style="font-size:13px;color:var(--ink-muted);margin-bottom:16px">Fill in your details – the resident will review your request. No payment required now.</p>
            <div style="background:var(--orange-light);border:1px solid #fbbf24;border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:14px;display:flex;align-items:flex-start;gap:8px">
                <span>⚠️</span>
                <div style="font-size:13px;color:#92400e">
                    <strong>Finder's Fee</strong><br>
                    If you <b>successfully rent this apartment</b>, you'll be invoiced a <b>finder's fee</b> (separate from any other charges). This fee ranges from <b>₦20,000 to ₦100,000</b> depending on the apartment, and covers our advertising and matching costs. We only get paid when you find your home.
                </div>
            </div>
            <form id="intro-request-form">
                <div class="form-row">
                    <div class="form-group"><label>Your Name *</label><input type="text" id="req-name" required></div>
                    <div class="form-group"><label>Email *</label><input type="email" id="req-email" required></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Phone *</label><input type="tel" id="req-phone" required></div>
                    <div class="form-group"><label>Telegram (optional)</label><input type="text" id="req-telegram"></div>
                </div>
                <div class="form-group">
                    <label>Reason for Request *</label>
                    <select id="req-reason" required>
                        <option value="">Select reason…</option>
                        <option>I'd like to rent this apartment.</option>
                        <option>I'd like to ask about the building.</option>
                        <option>I'd like to ask about possible vacancies.</option>
                        <option>Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Additional questions for the resident</label>
                    <div style="display:flex;flex-direction:column;gap:8px;margin-top:6px">
                        <label style="display:flex;align-items:center;gap:8px;font-weight:400;font-size:14px;color:var(--ink);cursor:pointer">
                            <input type="checkbox" class="req-extra" value="Can you share photos of the apartment?" style="margin-top:0;flex-shrink:0;width:16px;height:16px;"> Can you share photos of the apartment?
                        </label>
                        <label style="display:flex;align-items:center;gap:8px;font-weight:400;font-size:14px;color:var(--ink);cursor:pointer">
                            <input type="checkbox" class="req-extra" value="Is there a video tour available?" style="margin-top:0;flex-shrink:0;width:16px;height:16px;"> Is there a video tour available?
                        </label>
                        <label style="display:flex;align-items:center;gap:8px;font-weight:400;font-size:14px;color:var(--ink);cursor:pointer">
                            <input type="checkbox" class="req-extra" value="What is the condition of the plumbing/electrical?" style="margin-top:0;flex-shrink:0;width:16px;height:16px;"> What is the condition of the plumbing/electrical?
                        </label>
                        <label style="display:flex;align-items:center;gap:8px;font-weight:400;font-size:14px;color:var(--ink);cursor:pointer">
                            <input type="checkbox" class="req-extra" value="Are there any additional fees?" style="margin-top:0;flex-shrink:0;width:16px;height:16px;"> Are there any additional fees?
                        </label>
                        <div style="display:flex;align-items:center;gap:8px">
                            <input type="checkbox" id="req-extra-other" class="req-extra" value="Other" onchange="document.getElementById('req-extra-other-text').style.display=this.checked?'block':'none'" style="margin-top:0;flex-shrink:0;width:16px;height:16px;">
                            <label for="req-extra-other" style="font-weight:400;font-size:14px;color:var(--ink);cursor:pointer">Other</label>
                            <input type="text" id="req-extra-other-text" placeholder="Please specify" style="display:none;flex:1;padding:6px 10px;border:1px solid var(--card-border);border-radius:var(--radius-sm);font-size:13px;margin-left:8px">
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label>Move Timeline *</label>
                    <select id="req-timeline" required>
                        <option value="">Select timeline…</option>
                        <option>Immediately</option>
                        <option>Within 30 Days</option>
                        <option>Within 3 Months</option>
                        <option>Just Exploring</option>
                    </select>
                </div>
                <div class="form-group" style="display:flex;align-items:flex-start;gap:8px;margin-bottom:16px">
                    <input type="checkbox" id="req-agree-finder" required style="width:16px;height:16px;margin-top:3px;flex-shrink:0;accent-color:var(--orange)">
                    <label for="req-agree-finder" style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--ink-muted);font-size:13px">
                        I agree that if I rent this apartment, I will be invoiced for the <strong>finder's fee</strong> as described above.
                    </label>
                </div>
                <button type="submit" class="btn-submit-request" id="btn-submit-intro">Send Request</button>
            </form>`;
        }

        function submitIntroductionRequest(e, listingId) {
            e.preventDefault();
            const agreeFinder = document.getElementById('req-agree-finder');
            if (!agreeFinder || !agreeFinder.checked) {
                showToast('Please agree to the finder\'s fee terms.', 'error');
                return;
            }
            const btn = document.getElementById('btn-submit-intro');
            if (btn) { btn.disabled = true; btn.textContent = 'Sending…'; }
            const extras = [];
            document.querySelectorAll('.req-extra:checked').forEach(cb => {
                if (cb.value === 'Other') {
                    const otherText = document.getElementById('req-extra-other-text')?.value.trim();
                    if (otherText) extras.push(otherText);
                } else {
                    extras.push(cb.value);
                }
            });
            const payload = {
                action: 'requestIntroduction',
                listingId,
                listingUrl: window.location.href,
                requesterName: document.getElementById('req-name')?.value || '',
                requesterEmail: document.getElementById('req-email')?.value || '',
                requesterPhone: document.getElementById('req-phone')?.value || '',
                requesterTelegram: document.getElementById('req-telegram')?.value || '',
                reason: document.getElementById('req-reason')?.value || '',
                moveTimeline: document.getElementById('req-timeline')?.value || '',
                extraQuestions: extras.join('; ')
            };
            apiFetch('requestIntroduction', payload, 'POST')
                .then(() => {
                    document.getElementById('introModalContent').innerHTML = `
                        <button class="modal-close" onclick="closeModal()">✕</button>
                        <div class="request-confirmation">
                            <div style="font-size:48px;margin-bottom:12px;">✅</div>
                            <h3>Request sent!</h3>
                            <p>The resident has up to 24 hours to respond. If they approve, you’ll get an email with next steps.</p>
                            <button class="btn-outline" onclick="closeModal()" style="margin-top:16px;">Close</button>
                        </div>`;
                })
                .catch(() => {
                    document.getElementById('introModalContent').innerHTML = `
                        <button class="modal-close" onclick="closeModal()">✕</button>
                        <div class="request-confirmation">
                            <h3>Something went wrong</h3>
                            <p>Please try again later.</p>
                            <button class="btn-outline" onclick="closeModal()" style="margin-top:16px;">Close</button>
                        </div>`;
                });
        }

        function copyListingLink(id) {
            const url = window.location.origin + '/listings/?id=' + id;
            navigator.clipboard.writeText(url).then(() => showToast('Link copied!'));
        }
        function shareListing(id, title) {
            const url = window.location.origin + '/listings/?id=' + id;
            if (navigator.share) navigator.share({ title: 'RentPal Listing', text: title, url });
            else copyListingLink(id);
        }

        async function loadSimilarListings(listing) {
            const grid = document.getElementById('similar-grid'); if (!grid) return;
            let all = state.allListings;
            if (!all.length) try { const d = await apiFetch('listings'); all = (d.listings || []).filter(l => l.verificationStatus === 'Verified' && l.listingStatus === 'Available'); } catch (e) { all = getMockListings().filter(l => l.verificationStatus === 'Verified' && l.listingStatus === 'Available'); }
            const others = all.filter(l => l.listingId !== listing.listingId);
            const scored = others.map(l => {
                let s = 0;
                if (l.area === listing.area) s += 3;
                if (l.apartmentType === listing.apartmentType) s += 2;
                if (l.location === listing.location) s += 1;
                const rd = Math.abs(getRentNumeric(String(l.rentExact || 0)) - getRentNumeric(String(listing.rentExact || 0)));
                if (rd < 300000) s += 2; else if (rd < 600000) s += 1;
                return { listing: l, score: s };
            });
            scored.sort((a, b) => b.score - a.score); const similar = scored.slice(0, 6);
            grid.innerHTML = similar.map(s => {
                const l = s.listing;
                return `<div class="listing-card" onclick="goToDetail('${l.listingId}')"><div class="card-comment-area" style="height:100px"><div class="comment-quote">"</div><div class="comment-text">${escapeHTML(l.comments || 'No description')}</div></div><div class="card-body"><span class="card-ref">${l.listingId}</span><div class="card-type" style="font-size:13px">${escapeHTML(l.apartmentType)}</div><div class="card-location-row"><span class="card-location-tag">${l.location === 'Mainland' ? '📍 Mainland' : '🏝️ Island'} ${escapeHTML(l.area)}</span></div><div class="card-rent" style="font-size:15px">${formatNaira(l.rentExact)}<span>/yr</span></div></div></div>`;
            }).join('') || '<p style="color:var(--ink-faint);font-size:13px">No similar listings</p>';
        }

        let autoRefreshInterval;
        function startAutoRefresh(){if(autoRefreshInterval)clearInterval(autoRefreshInterval);autoRefreshInterval=setInterval(async()=>{if(getRouteInfo().view!=='directory')return;try{const data=await apiFetch('listings');const fresh=(data.listings||[]).filter(l=>l.verificationStatus==='Verified'&&l.listingStatus==='Available');fresh.sort((a,b)=>new Date(b.postedDate)-new Date(a.postedDate));const oldIds=state.allListings.map(l=>l.listingId).sort().join(',');const newIds=fresh.map(l=>l.listingId).sort().join(',');if(oldIds!==newIds){state.allListings=fresh;state.filteredListings=[...fresh];state.displayedCount=Math.min(CONFIG.ITEMS_PER_PAGE,fresh.length);applyFilters();renderCards();updateCount();showToast('📣 Listings updated')}}catch(e){}},30000)}
        document.addEventListener('visibilitychange',()=>{if(!document.hidden&&getRouteInfo().view==='directory'){apiFetch('listings').then(data=>{const fresh=(data.listings||[]).filter(l=>l.verificationStatus==='Verified'&&l.listingStatus==='Available');fresh.sort((a,b)=>new Date(b.postedDate)-new Date(a.postedDate));state.allListings=fresh;state.filteredListings=[...fresh];state.displayedCount=Math.min(CONFIG.ITEMS_PER_PAGE,fresh.length);applyFilters();renderCards();updateCount()}).catch(()=>{})}});

        function goToDetail(id) { navigateTo('/listings/?id=' + id); }
        function goToDirectory() { navigateTo('/listings'); }
        function toggleMobileMenu() { document.getElementById('mobile-menu').classList.toggle('open'); }
        function refreshCurrentView() { if (getRouteInfo().view === 'directory') { renderCards(); renderRecentlyViewed(); } }
        function init() {
            handleRoute();
            document.querySelectorAll('.mobile-menu a').forEach(a => a.addEventListener('click', () => document.getElementById('mobile-menu').classList.remove('open')));
            document.addEventListener('click', (e) => {
                const a = e.target.closest('a');
                if (a && a.getAttribute('href')?.startsWith('/listings') && !a.href.startsWith('http') && a.target !== '_blank') {
                    e.preventDefault();
                    navigateTo(a.getAttribute('href'));
                }
            });
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
